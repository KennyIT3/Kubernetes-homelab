---
- name: Configure Kubernetes prerequisites on RHEL nodes
  hosts: working_ansible
  become: true
  gather_facts: true

  vars:
    k8s_kernel_modules:
      - overlay
      - br_netfilter

  tasks:
    - name: Install Kubernetes prerequisite packages
      ansible.builtin.dnf:
        name:
          - iproute-tc
          - conntrack-tools
          - socat
          - ethtool
          - curl
          - tar
        state: present

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false
      when: ansible_facts['swaptotal_mb'] | int > 0

    - name: Disable swap persistently in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Persist Kubernetes kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Load Kubernetes kernel modules now using raw
      ansible.builtin.raw: "modprobe {{ item }}"
      loop: "{{ k8s_kernel_modules }}"
      changed_when: false

    - name: Persist Kubernetes sysctl settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply Kubernetes sysctl settings
      ansible.builtin.raw: sysctl --system
      changed_when: true

    - name: Verify loaded modules
      ansible.builtin.raw: "lsmod | egrep 'overlay|br_netfilter'"
      register: lsmod_output
      changed_when: false

    - name: Verify sysctl settings
      ansible.builtin.raw: "sysctl net.bridge.bridge-nf-call-iptables net.bridge.bridge-nf-call-ip6tables net.ipv4.ip_forward"
      register: sysctl_verify
      changed_when: false

    - name: Display Kubernetes prerequisite verification
      ansible.builtin.debug:
        msg:
          - "{{ lsmod_output.stdout_lines }}"
          - "{{ sysctl_verify.stdout_lines }}"
